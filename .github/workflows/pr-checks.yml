name: PR checks

# The repo had no pull_request CI at all — `make validate` ran only in the pre-push hook,
# so a PR that broke a skill's frontmatter or left `dist/` behind the directory could
# merge unnoticed. Neither check needs a registry credential, so both run on every PR.

on:
  pull_request:

concurrency:
  # Keyed on the PR number, not `github.head_ref`. The head ref is a bare branch name with
  # no repository qualifier, so two forks that both push `patch-1` share one group — and
  # `cancel-in-progress` would then kill one PR's run because an unrelated PR pushed.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - name: Skill frontmatter parses
        run: node scripts/check-skill-frontmatter.js

      - name: Atoms and compiled skills are current
        run: node scripts/compile.mjs --check

      # A file over ~10,000 tokens fails Claude Code's Read tool, so the skill
      # never loads while `claude plugin validate` still passes it. Hard gate.
      - name: Shipped skill files fit the per-file load cap
        run: node scripts/check-content-size.mjs

      # Every skill the plugin distributes must exist, and every skill directory must be
      # distributed. A directory added without its manifest entry ships to nobody.
      - name: Distributed skills match the directory
        run: |
          node -e '
            const { readdirSync, existsSync } = require("node:fs");
            const listed = require("./.claude-plugin/plugin.json").skills;
            if (!Array.isArray(listed)) throw new Error("plugin.json skills is no longer an array");
            const missing = listed.filter((p) => !existsSync(p));
            const dirs = readdirSync("skills", { withFileTypes: true })
              .filter((d) => d.isDirectory())
              .map((d) => `./skills/${d.name}`);
            const unlisted = dirs.filter((d) => !listed.includes(d));
            if (missing.length || unlisted.length) {
              if (missing.length) console.error("listed but absent:", missing.join(", "));
              if (unlisted.length) console.error("present but undistributed:", unlisted.join(", "));
              process.exit(1);
            }
            console.log(`${listed.length} skills listed and present`);
          '

  # The real `claude plugin validate --strict` used to run only in the skippable local
  # pre-push hook, so a PR could merge without ever passing the actual validator. It is
  # a structural check that needs no API credential. A separate job keeps a validator
  # failure distinguishable from a content-check failure.
  plugin_validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: CLI is new enough to validate a skills directory
        run: node scripts/check-claude-version.mjs

      - name: Plugin manifest validates
        run: claude plugin validate . --strict

      - name: Skills directory validates
        run: claude plugin validate ./skills --strict
